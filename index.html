<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123c35" />
    <title>전남경찰청 탑재장비 모바일 학습 앱 | 입장</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=20260813-3" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="data/equipment.js" defer></script>
    <script src="data/organization.js" defer></script>
    <script src="data/analytics.js" defer></script>
    <script src="scripts/shared.js?v=20260805-5" defer></script>
    <script src="scripts/login.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-layout">
      <section class="login-panel" aria-labelledby="login-title">
        <div class="brand-lockup">
          <img class="brand-ci" src="assets/jeonnam-police-ci.png?v=20260805-4" alt="" />
          <div>
            <h1 id="login-title" class="app-title">
              <span>전남경찰청</span>
              <span>탑재장비 모바일 학습 앱</span>
            </h1>
          </div>
        </div>

        <form id="entryForm" class="entry-form">
          <section class="org-picker" aria-label="소속 선택">
            <div class="field">
              <span>소속 구분</span>
              <div class="org-type-group" role="radiogroup" aria-label="소속 구분">
                <label>
                  <input type="radio" name="entryOrgType" value="local" checked />
                  <span>지역관서</span>
                </label>
                <label>
                  <input type="radio" name="entryOrgType" value="station" />
                  <span>경찰서</span>
                </label>
                <label>
                  <input type="radio" name="entryOrgType" value="headquarters" />
                  <span>전남청</span>
                </label>
              </div>
            </div>

            <label id="stationField" class="field">
              <span>경찰서</span>
              <select id="entryStation"></select>
            </label>

            <label id="localOfficeField" class="field">
              <span>지역관서</span>
              <select id="entryLocalOffice"></select>
            </label>

            <label id="headquartersField" class="field" hidden>
              <span>소속</span>
              <select id="entryHeadquarters"></select>
            </label>
          </section>

          <div class="form-grid identity-grid">
            <label class="field">
              <span>성명</span>
              <input
                id="entryName"
                type="text"
                autocomplete="name"
                placeholder="예: 홍길동"
                maxlength="10"
                pattern="[가-힣]{2,10}"
                required
              />
            </label>

            <label class="field identity-code">
              <span>접속 비밀번호</span>
              <input id="entryCode" type="password" inputmode="numeric" autocomplete="off" required />
            </label>

            <label class="field identity-rank">
              <span>계급</span>
              <select id="entryRank" required>
                <option value="">선택</option>
                <option>순경</option>
                <option>경장</option>
                <option>경사</option>
                <option>경위</option>
                <option>경감</option>
                <option>경정</option>
                <option>총경</option>
                <option>경무관</option>
                <option>치안감</option>
                <option>치안정감</option>
                <option>치안총감</option>
                <option>기타</option>
              </select>
            </label>
          </div>

          <label class="consent-row">
            <input id="entryConsent" type="checkbox" required />
            <span>교육 목적 외 공유 금지 및 접속정보 저장 동의</span>
          </label>

          <p id="entryError" class="form-error" role="alert"></p>

          <button class="button button-primary button-large" type="submit">
            <i data-lucide="log-in" aria-hidden="true"></i>
            입장하기
          </button>
        </form>

      </section>
    </main>
  </body>
</html>
