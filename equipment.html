<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#123c35" />
    <title>전남경찰청 탑재장비 모바일 학습 앱 | 장비 학습</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css?v=20260813-4" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="data/equipment.js?v=20260813-5" defer></script>
    <script src="data/analytics.js" defer></script>
    <script src="scripts/shared.js?v=20260805-5" defer></script>
    <script src="scripts/equipment-page.js?v=20260813-5" defer></script>
  </head>
  <body class="detail-page">
    <header class="detail-topbar">
      <a id="backToList" class="back-link" href="home.html?view=equipment" aria-label="목록으로 돌아가기">
        <i data-lucide="chevron-left" aria-hidden="true"></i>
        목록
      </a>
      <a class="detail-home-link" href="home.html" aria-label="홈 화면으로 이동">
        <img class="app-ci" src="assets/jeonnam-police-ci.png?v=20260805-4" alt="" />
        <span class="detail-home-title">
          <span>전남경찰청</span>
          <span>탑재장비 모바일 학습 앱</span>
        </span>
      </a>
      <span id="detailCategory" class="category-pill">장비</span>
    </header>

    <main class="detail-main">
      <section class="detail-hero">
        <div id="detailThumb" class="detail-thumb" aria-hidden="true"></div>
        <div>
          <p class="eyebrow">기본 교육</p>
          <h1 id="detailTitle">장비 학습</h1>
          <p id="detailRole" class="detail-role"></p>
        </div>
      </section>

      <section class="video-section" aria-label="교육영상">
        <div id="videoFrame" class="video-frame"></div>
        <p id="videoStatus" class="video-status">영상 미시청</p>
      </section>

      <section class="lesson-section">
        <div class="section-heading">
          <div>
            <h2>사용 절차</h2>
          </div>
        </div>
        <ol id="detailSteps" class="step-list"></ol>
      </section>

      <section class="lesson-section">
        <div class="section-heading">
          <div>
            <h2>주의사항</h2>
          </div>
        </div>
        <ul id="detailCautions" class="caution-list"></ul>
      </section>

      <section class="lesson-section quiz-section">
        <div class="section-heading">
          <div>
            <h2>체크퀴즈</h2>
          </div>
          <span id="quizStatus">미응시</span>
        </div>
        <div id="quizList" class="quiz-list"></div>
        <button id="submitQuiz" class="button button-secondary button-wide" type="button">
          <i data-lucide="list-checks" aria-hidden="true"></i>
          정답 확인
        </button>
        <p id="quizFeedback" class="quiz-feedback" role="status"></p>
      </section>
    </main>
  </body>
</html>
